name: Publish to YouTube

on:
  push:
    branches: [main]
    paths: ["pipeline/episodes.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "upload = upload ready episodes, check = only test the YouTube login"
        default: upload
        type: choice
        options: [upload, check]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upload ready episodes
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then
            python3 pipeline/publish.py check
          else
            python3 pipeline/publish.py
          fi
      - name: Save video links back to the episode log
        if: github.event.inputs.mode != 'check'
        run: |
          if ! git diff --quiet pipeline/episodes.json; then
            git config user.name "hidden-mechanics-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pipeline/episodes.json
            git commit -m "Log YouTube upload [skip ci]"
            git push
          fi
